# Prebuilt release image; no checkout or build is needed.
# Localhost is the safe default. For a trusted LAN, set NUVIOEXPORTER_BIND_IP
# to your server's LAN address (or 0.0.0.0 to listen on all interfaces).
services:
  nuvioexporter:
    image: ghcr.io/mckenna654/nuvioexporter:3.2.0
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "${NUVIOEXPORTER_BIND_IP:-127.0.0.1}:${NUVIOEXPORTER_PORT:-7088}:7088"
